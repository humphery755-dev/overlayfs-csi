[package]
name = "overlayfs-csi"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.77"
async-trait = "0.1.75"
base64 = "0.21.7"
clap = { version = "4.4.12", features = ["derive"] }
duct = "0.13.7"
futures = "0.3.30"
hyper = { version = "0.14.28", features = ["server", "http1", "runtime", "stream"] }
k8s-openapi = { version = "0.20.0", features = ["v1_23", "schemars"] }
kube = { version = "0.87.2", features = ["runtime"] }
prost = "0.12.3"
prost-types = "0.12.3"
rustls-pemfile = "1.0.4"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_yaml = "0.9.29"
time = { version = "0.3.31", features = ["parsing", "formatting"] }
tokio = { version = "1.35.1", features = ["full"] }
tokio-rustls = "0.24.1"
tokio-stream = { version = "0.1.14", features = ["full"] }
tonic = { version = "0.10.2", features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"

[build-dependencies]

anyhow = "1.0.77"
tokio = { version = "1.35.1", features = ["full"] }
reqwest = { version = "0.11.23", features = ["rustls-tls"], default_features = false }
tonic-build = "0.10.2"

[package.metadata.cargo-machete]
ignored = ["prost", "prost-types"]
