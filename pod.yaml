# 持久卷示例：独立 PVC + 引用它的 Pod。
#
# ── 长期停机后数据不丢的操作约定 ─────────────────────────────
# PVC 是数据的唯一锚点：数据目录跟随 PVC 存活，与 Pod 无关。
#   删除 Pod：      kubectl delete pod test        （PVC 保留，数据保留）
#   停机任意久后恢复：kubectl apply -f pod.yaml     （同名 PVC 复用，数据回粘）
# 禁止：kubectl delete -f pod.yaml —— 会连 PVC 一起删除，
#       PV 随之回收，数据目录被 GC 清理，数据不可恢复。
#
# ── 节点选择 ───────────────────────────────────────────────
# StorageClass 为 WaitForFirstConsumer：Pod 被调度后，调度器把选中节点写进
# volume.kubernetes.io/selected-node 注解，该节点的驱动实例供给卷并把 PV 的
# nodeAffinity 锁定在那里——之后该 PVC 的所有 Pod（包括停机数月后重建的）
# 都会被调度回同一节点。无需 nodeName；如确需指定，添加 spec.nodeName。
#
# ── namespace ──────────────────────────────────────────────
# 与 chart 默认部署位置（kube-system）一致，按需调整。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo
  namespace: kube-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: overlayfs.csi.k8s.io
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test
  namespace: kube-system
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: test
      #image: debian:bullseye-slim
      image: openresty/openresty:latest
      #command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /test
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo
---
# ── VM 模式示例：一个注解，整个系统目录持久化 ───────────────────
# pod 打 overlayfs.csi.k8s.io/max-age-s 注解即开启 VM 模式（无需 PVC）：
#   - 系统目录 /etc /usr /var /opt /root /home /srv 以持久 upperdir 叠加 overlay，
#     apt install / 改配置的每一次写入直接落盘（无退出写回，SIGKILL/断电不丢已确认写入）
#   - pod 删除 → 任意久后 apply 同名 pod → 修改原样回来
#   - 注解值 = pod 删除后快照保留秒数（下面 = 90 天，过期被 GC 清理）
# 要求：显式 command（wrapper 需转发）；pod 以 privileged 运行（webhook 自动注入）；
#       主镜像含 sh。限制与语义见 docs/superpowers/specs/2026-09-17-pod-annotation-vm-persistence-design.md
apiVersion: v1
kind: Pod
metadata:
  name: vm-demo
  namespace: kube-system
  annotations:
    overlayfs.csi.k8s.io/max-age-s: "7776000"
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: vm-demo
      image: debian:bullseye-slim
      command: ["sleep", "infinity"]
