# 持久卷示例：独立 PVC + 引用它的 Pod。
# StorageClass 为 WaitForFirstConsumer：Pod 被调度后，调度器把选中节点写进
# volume.kubernetes.io/selected-node 注解，该节点的驱动实例供给卷并把 PV 的
# nodeAffinity 锁定在那里——之后该 PVC 的所有 Pod 都会被调度回同一节点。
# 因此无需 nodeName 手动固定；如确需指定节点，添加 spec.nodeName 即可。
# namespace 与 chart 默认部署位置（kube-system）一致，按需调整。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo
  namespace: kube-system
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: overlayfs.csi.k8s.io
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test
  namespace: kube-system
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: test
      image: debian:bullseye-slim
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /test
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo
