{{- if .Values.webhook.enabled }}
# ── VM-like pod webhook 部署物 ────────────────────────────────────────────
# pod 打 overlayfs.csi.k8s.io/max-age-s 注解即开启 VM 模式：webhook 注入
# privileged wrapper + hostPath 持久卷，系统目录以持久 upperdir 叠加 overlay，
# 写入穿透落盘，pod 删除重建后修改原样回来。
# 机制与错误处理见 docs/superpowers/specs/2026-09-17-pod-annotation-vm-persistence-design.md

# 自签证书：helm 安装时生成，upgrade 时 lookup 复用已存在的（否则 apiserver 端
# caBundle 与服务端证书会失配）。
{{- $svcName := printf "%s-webhook" (.Values.name | replace "." "-") }}
{{- $svc := printf "%s.%s.svc" $svcName .Values.namespace }}
{{- $secretName := printf "%s-webhook-cert" .Values.name }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $ca := "" }}
{{- $key := "" }}
{{- if $existing }}
{{- $ca = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $pair := genSelfSignedCert $svc nil (list $svc (printf "%s.cluster.local" $svc)) 3650 }}
{{- $ca = $pair.Cert | b64enc }}
{{- $key = $pair.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ $secretName }}"
  namespace: "{{ .Values.namespace }}"
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca }}
  tls.key: {{ $key }}
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ $svcName }}"
  namespace: "{{ .Values.namespace }}"
spec:
  selector:
    app: "{{ .Values.name }}"
  ports:
    - port: {{ .Values.webhook.port }}
      targetPort: {{ .Values.webhook.port }}
---
# vm-init.sh 不再走 ConfigMap：webhook 把脚本直接写进每份快照卷根
# （<storageRoot>/vm/<ns>/<pod>/vm-init.sh），随 hostPath 卷挂载进容器。
# ConfigMap 是 namespace 域资源，曾导致其他 namespace 的 VM pod
# 卡在 FailedMount（configmap not found）；见 src/webhook.rs::VM_INIT_SCRIPT。
---
# failurePolicy: Ignore——webhook 停机不得拖累普通 pod 创建；带注解的 pod 会被
# controller 的 vm_gc_once 兜底删除重建（静默不持久 = 数据丢失，绝不放行）。
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: "{{ .Values.name }}"
webhooks:
  - name: vm.{{ .Values.name }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    matchPolicy: Equivalent
    timeoutSeconds: 10
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: "*"
    clientConfig:
      service:
        name: "{{ $svcName }}"
        namespace: "{{ .Values.namespace }}"
        path: /mutate
        port: {{ .Values.webhook.port }}
      caBundle: {{ $ca | quote }}
{{- end }}
