namespace: kube-system
image: overlayfs-csi:latest
name: overlayfs.csi.k8s.io
# StorageClass 名；留空则使用 driver name
storageClassName: ""
# Host path root for bases/volumes/work
storageRoot: /var/lib/overlayfs-csi
# Maximum age of a base before cleaning it up.
# PVC 数据（用户变更）不依赖此值——它随 PVC 永久保留。
# 此值决定「停机后重建 Pod 时，启动环境的完整视图」能回粘多久：
# 需要停机 N 天后仍拿到完整环境（base + 变更），就把此值设为大于 N 天。
# 86400=1 天；2592000=30 天（下例）。
# 可被 PVC 注解 overlayfs.csi.k8s.io/max-age-s 逐卷覆盖。
maxAgeSeconds: 2592000

# VM-like pod：pod 打 overlayfs.csi.k8s.io/max-age-s 注解即开启 VM 模式——
# 系统目录（/etc /usr /var /opt /root /home /srv）以持久 upperdir 叠加 overlay，
# 写入穿透落盘；pod 删除重建后 apt 装的软件、改的配置原样回来。
# 注解值 = pod 删除后快照保留秒数（过期由 GC 清理）。
webhook:
  enabled: true
  port: 9443
